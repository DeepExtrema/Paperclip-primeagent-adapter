name: adapter-and-bff
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-behavior:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Permit user namespaces on this disposable Ubuntu runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Verify real namespace creation before running containment tests
        run: bwrap --unshare-all --die-with-parent --ro-bind / / --proc /proc /usr/bin/true
      - run: npm ci
      - run: npm run verify:offline
  pinned-source-patches:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - run: npm run verify:upstream
